name: Mobile Frontend CI Pipeline

on:
  push:
    branches:
      - main
      - budget-app
    paths:
      - 'mobile/**'
      - '.github/workflows/ci-mobile.yaml'
  pull_request:
    branches:
      - main
    paths:
      - 'mobile/**'
      - '.github/workflows/ci-mobile.yaml'

jobs:
  mobile-ci:
    name: Mobile Frontend Lint & Build
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./mobile

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ./mobile/package-lock.json

      - name: Install Dependencies
        run: npm install

      - name: Run Linter
        run: npm run lint

      - name: Test Build (Ensures React.js compiles)
        run: npm run build